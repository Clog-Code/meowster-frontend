name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
      - dev
  pull_request:
    branches:
      - main
      - master
      - dev
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: |
          flutter build apk --release \
            --dart-define=AGENT_BASE_URL="${{ secrets.AGENT_BASE_URL }}" \
            --dart-define=VISUAL_MODEL_BASE_URL="${{ secrets.VISUAL_MODEL_BASE_URL }}" \
            --dart-define=TTS_BASE_URL="${{ secrets.TTS_BASE_URL }}"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: amd-pet-frontend-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
